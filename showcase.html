<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>业委会会议管理 · 模块总览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2b2b33;
    font-family: -apple-system, "PingFang SC", sans-serif;
    padding: 32px;
  }
  .board-title {
    color: #fff; font-size: 26px; font-weight: 700; margin-bottom: 4px;
  }
  .board-sub { color: #9aa0ad; font-size: 14px; margin-bottom: 26px; }
  #gallery {
    display: flex; flex-direction: row; align-items: flex-start; gap: 22px;
  }
  .panel { display: flex; flex-direction: column; flex-shrink: 0; }
  .panel-num {
    color: #FFC04D; font-size: 13px; font-weight: 700; margin-bottom: 2px;
  }
  .panel-title {
    color: #fff; font-size: 15px; font-weight: 600; margin-bottom: 4px;
  }
  .panel-desc { color: #8b909c; font-size: 12px; margin-bottom: 12px; max-width: 375px; line-height: 1.5; }
  .frame {
    width: 375px; border: none; border-radius: 22px; background: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
</style>
</head>
<body>
  <div class="board-title">业委会会议管理模块 · 流程总览</div>
  <div class="board-sub">业主大会 App — 业主委员会会议全流程（准备 → 进行 → 结束 → 公示）</div>
  <div id="gallery"></div>

<script>
const panels = [
  { label:'业委专区首页', desc:'应用主入口，业委会各功能模块。', init:'' },
  { label:'会议中心', desc:'四类会议形式入口：业委会 / 业主大会 / 接待记录 / 业务学习。', init:"go('meeting-hub')" },
  { label:'准备阶段 · 会前送达', desc:'会前7日内通知/材料送达全体委员，倒计时预警，未送达不可开会。', init:"go('committee')" },
  { label:'进行中 · 核查与多议题表决', desc:'会议记录合规核查 + 混合签署 + 多议题独立表决（重大事项单一）。', init:"go('committee');switchTab('ongoing',document.querySelectorAll('.stage-tab')[1]);" },
  { label:'会议结束 · 公示管控', desc:'分级判定有效性；3日内公示，逾期锁定并计入年度考核扣分。', init:"go('committee');switchTab('ended',document.querySelectorAll('.stage-tab')[2]);" },
  { label:'会议纪要（自动生成）', desc:'按会议记录自动汇总参会/议题/表决/签字/结论，可导出。', init:"openMinutes(2);" },
  { label:'信息公开', desc:'已公示的会议纪要与决定，面向全体业主展示。', init:"go('info-public');" },
];

const galleryHeightTuners = `
  .phone{height:auto!important;min-height:0!important;overflow:visible!important;}
  .committee-scroll,.minutes-scroll,.info-scroll,.hub-scroll{overflow:visible!important;flex:none!important;height:auto!important;}
  .bottom-nav,.fab,.float-btn{display:none!important;}
`;

const g = document.getElementById('gallery');
panels.forEach((p, i) => {
  const wrap = document.createElement('div'); wrap.className = 'panel';
  wrap.innerHTML = `<div class="panel-num">0${i+1}</div>
    <div class="panel-title">${p.label}</div>
    <div class="panel-desc">${p.desc}</div>`;
  const f = document.createElement('iframe');
  f.className = 'frame'; f.src = 'index.html';
  f.onload = () => initFrame(f, p.init);
  wrap.appendChild(f);
  g.appendChild(wrap);
});

function initFrame(f, script) {
  try {
    const w = f.contentWindow, d = f.contentDocument;
    const s = d.createElement('style');
    s.textContent = galleryHeightTuners;
    d.head.appendChild(s);
    if (script) w.eval(script);
    setTimeout(() => {
      const phone = d.querySelector('.phone');
      f.style.height = (phone.scrollHeight + 16) + 'px';
    }, 120);
  } catch (e) { console.log('initFrame error', e); }
}
</script>
</body>
</html>
