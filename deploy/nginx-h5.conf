# ============================================================
# 业委会 H5 —— nginx 部署配置（方案B / 沙箱测试环境）
# 用法：把下面 __占位__ 换成你的真实值，放到 nginx 的 conf.d/ 或 sites-enabled/，
#       nginx -t 校验，nginx -s reload 生效。
# 三个关键点：① SPA 回退 index.html ② /api 同源反代到后端 ③ 放开大体积上传 + 长超时
# ============================================================

# HTTP → HTTPS 跳转（微信里录音/相机需要 HTTPS 安全上下文，务必用 https）
server {
    listen 80;
    server_name __你的域名__;          # 例：ywh-sandbox.example.com
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __你的域名__;

    # —— SSL 证书（换成你的证书路径）——
    ssl_certificate     __/path/to/fullchain.pem__;
    ssl_certificate_key __/path/to/privkey.pem__;

    # 录音文件较大：放开上传体积（后端 spring 上限是 200MB，这里给到 210m）
    client_max_body_size 210m;

    # ① 前端静态：dist 目录 + history 模式回退
    location / {
        root  __/var/www/ywh-h5/dist__;   # 把 h5/dist 传到这里
        index index.html;
        try_files $uri $uri/ /index.html;  # ← vue-router history 模式，刷新子页面必须回退，否则 404
    }

    # ② 后端接口：同源反代到 Spring Boot（前端用相对 /api，无需改代码/重新构建）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;   # 后端地址，若不在同机改成实际 IP:8080
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ③ 长超时：AI 润色最长 ~210s、OCR ~120s，默认 60s 会把这些请求掐断
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 上传录音是大文件，别让 nginx 缓冲整包
        proxy_request_buffering off;
    }

    # ④ 实时流式语音识别（议题意见「边说边出字」）：浏览器 WS /asr-ws → ocr-asr-service /v1/asr/stream
    #    内网令牌在这里注入(?token=)，不暴露给浏览器。把 __OCR内网令牌__ 换成 ocr-asr-service/.env 里的 INTERNAL_TOKEN。
    #    ⚠ 安全提示：此路径目前无逐用户鉴权(WS 握手不带 JWT)，任何能访问本域名的人都能用 ASR(消耗豆包额度)。
    #      沙箱临时链接可接受；正式上线前建议改为经 Spring 后端做 JWT 网关的 WS 代理(见 memory: asr-realtime-streaming-voice)。
    location /asr-ws {
        proxy_pass http://127.0.0.1:8003/v1/asr/stream?token=__OCR内网令牌__;  # OCR/ASR 服务，若不在同机改 IP:8003
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # WebSocket 升级
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout  600s;    # 长时间说话别被掐断
        proxy_send_timeout  600s;
    }

    # 静态资源缓存（可选）：带 hash 的 assets 长缓存
    location /assets/ {
        root __/var/www/ywh-h5/dist__;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
