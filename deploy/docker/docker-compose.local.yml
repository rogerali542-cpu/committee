# 仅用于【本地验证】：给入口服务映射一个宿主机端口，方便浏览器打开测试。
# 平台部署【不要】上传本文件（平台用 expose + sandbox.expose 标签自动路由，不需要 ports）。
# pull_policy: never —— 本地用刚构建好的镜像，别去 registry 拉（这些镜像不在任何仓库）。
#
# 本地跑：
#   docker compose --env-file deploy/docker/.env \
#     -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.local.yml up -d
# 然后浏览器打开 http://localhost:8088
services:
  ocr-asr-service:
    pull_policy: never
  backend:
    pull_policy: never
  web:
    pull_policy: never
    ports:
      - "8088:80"
